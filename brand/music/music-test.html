<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MC.SESH Music Test</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0d1017; color:#e8eef8; font:16px/1.5 system-ui,"Segoe UI",sans-serif; padding:16px; }
  .card { width:min(560px,100%); background:#161b26; border:1px solid #243049; border-radius:16px; padding:28px; }
  h1 { margin:0 0 6px; font-size:22px; } p { color:#8a96ab; margin:6px 0 18px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  button { background:#39e6a8; color:#06231a; border:0; border-radius:10px; padding:12px 22px; font:600 16px system-ui; cursor:pointer; }
  button.alt { background:#243049; color:#e8eef8; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; }
  .chip { padding:3px 10px; border-radius:20px; border:1px solid #2c3a57; color:#8a96ab; font-size:13px; }
  .chip.on { color:#06231a; background:#39e6a8; border-color:#39e6a8; }
  #now { margin-top:14px; color:#8a96ab; }
</style>
</head>
<body>
<div class="card">
  <h1>MC.SESH &middot; music test</h1>
  <p>Original tune. Pass 1 piano, 1.5 + reese bass and arp, 2 + drums, 2.5 + boom bap, 3 everything, then it loops.</p>
  <div class="row">
    <button id="play">&#9654; Play</button>
    <button id="mute" class="alt">Mute</button>
    <button id="skip" class="alt" title="Start at pass 4, the last one before it starts over at the piano, so you hear the restart without waiting">Jump to pass 4 (hear the restart)</button>
    <label>Volume <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8"></label>
  </div>
  <div class="chips" id="chips"></div>
  <div id="now">Ready</div>
</div>
<script src="/web/setup/music.js"></script>
<script>
const $ = (id) => document.getElementById(id);
$('chips').innerHTML = McMusic.STAGES.map((s, i) => '<span class="chip" data-i="' + i + '">' + s + '</span>').join('');
McMusic.onStage((name, i) => { document.querySelectorAll('.chip').forEach((e) => e.classList.toggle('on', +e.dataset.i <= i)); $('now').textContent = 'Now: ' + name; });
McMusic.setCycle(4);   // test: start over at the piano after the 4th pass
$('skip').onclick = () => { if (McMusic.playing) McMusic.stop(); McMusic.start({ fromPass: 3 }); $('play').innerHTML = '&#9632; Stop'; };
$('play').onclick = () => { if (McMusic.playing) { McMusic.stop(); $('play').innerHTML = '&#9654; Play'; $('now').textContent = 'Ready'; document.querySelectorAll('.chip').forEach((e) => e.classList.remove('on')); } else { McMusic.start(); $('play').innerHTML = '&#9632; Stop'; } };
let m = false; $('mute').onclick = () => { m = !m; McMusic.setMuted(m); $('mute').textContent = m ? 'Unmute' : 'Mute'; };
$('vol').oninput = () => McMusic.setVolume(+$('vol').value);
</script>
</body>
</html>
