<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151a">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MC.SESH">
<title>MC.SESH</title>
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<script>try { var th = localStorage.getItem('mcm.theme'); if (th === 'dark' || th === 'light') document.documentElement.setAttribute('data-theme', th); } catch (e) { }</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" class="login hidden"></div>
<div id="app" class="app hidden">
  <header class="top">
    <div class="brand"><img class="logo" src="logo.png" alt="MC.SESH"><span class="brand-name hidden">MC.SESH</span><span id="verTag" class="ver"></span></div>
    <div class="top-right">
      <span id="remote" class="remote" title="Open this address in a browser on your network"></span>
      <button id="bkMgrBtn" class="btn ghost iconbtn" aria-label="Backup manager" title="Backup manager (all backups of all servers)"></button>
      <button id="updAllBtn" class="btn ghost iconbtn hidden" aria-label="Stop and update all servers" title="Stop and update all servers"></button>
      <button id="refreshBtn" class="btn ghost iconbtn" aria-label="Refresh server info" title="Refresh server info (re-reads every server)"></button>
      <button id="musicBtn" class="btn ghost iconbtn" aria-label="Music" title="Music"></button>
      <button id="bellBtn" class="btn ghost iconbtn hidden" aria-label="Notifications" title="Notifications"></button>
      <button id="usersBtn" class="btn ghost iconbtn hidden" aria-label="Accounts and access" title="Accounts and access"></button>
      <button id="settingsBtn" class="btn ghost iconbtn" aria-label="Settings" title="Settings"></button>
      <button id="acct" class="btn ghost iconbtn" aria-label="Account" title="Account"></button>
    </div>
  </header>
  <div id="banner" class="banner hidden"></div>
  <div id="mbar" class="mbar"></div>
  <div class="layout">
    <aside id="side" class="side"></aside>
    <main id="main" class="main"></main>
  </div>
  <nav id="bottomnav" class="bottomnav" aria-label="Sections"></nav>
</div>
<div id="toasts" class="toasts"></div>
<script src="qr.js"></script>
<script src="complete.js"></script>
<script src="quick.js"></script>
<script src="app.js"></script>
<script src="manage.js"></script>
<script src="users.js"></script>
<script src="mods.js"></script>
<script src="servertools.js"></script>
<script src="backups.js"></script>
<script src="journeymap.js"></script>
<script src="autorestart.js"></script>
<script src="worlds.js"></script>
<script src="packs.js"></script>
<script src="mobilebar.js"></script>
<script src="notify.js"></script>
<script src="setup/music.js"></script>
<script src="musicdock.js"></script>
</body>
</html>
